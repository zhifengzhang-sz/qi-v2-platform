# The tutorial's catalog (README.md beside it): massive-spy-1m as config/catalog.yaml has it, but where its reader
# keeps Massive's pages, a folder the user names, never the stack's (~/.local/share/qi/massive/pages). It is not read
# as it is: the page writes the user's copy from it, @ROOT@ the repository's root and @PAGES@ the pages' folder, and
# make start STACK=test reads that copy (CATALOG=). Acquisition reads its dataset alone (plugins.md, 3).
datasets:
  - name: massive-spy-1m
    source: massive
    command: [@ROOT@/bin/massive-reader, -pages, @PAGES@]
    instruments: [SPY]
    timeframes: [M1]
    history: 2y
    reread: 30d   # how far back each run asks again, Massive revising a bar after it has given it
    delay: 20h    # how old a bar must be before it is first read: a session's last, after Massive's day is final
    cleaning: [@ROOT@/bin/validation]
    tolerance: 10 # the damaged minutes, a high or a low changed, the clean topic keeps before it is made again
    session:
      zone: America/New_York
      open: "09:30"
      close: "16:00"
      closed: [2024-11-28, 2024-12-25, 2025-01-01, 2025-01-09, 2025-01-20, 2025-02-17, 2025-04-18, 2025-05-26,
               2025-06-19, 2025-07-04, 2025-09-01, 2025-11-27, 2025-12-25, 2026-01-01, 2026-01-19, 2026-02-16,
               2026-04-03, 2026-05-25, 2026-06-19, 2026-07-03, 2026-09-07, 2026-11-26, 2026-12-25]
      early: { 2024-11-29: "13:00", 2024-12-24: "13:00", 2025-07-03: "13:00", 2025-11-28: "13:00", 2025-12-24: "13:00",
               2026-11-27: "13:00", 2026-12-24: "13:00" }
