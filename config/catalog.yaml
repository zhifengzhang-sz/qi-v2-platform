# The catalog: each dataset, its series, from where and how much history, the program that reads its source and
# the cleaning that keeps its series' clean topic (docs/impl/engineering/plugins.md, 3). Acquisition reads the dataset
# it is given (-dataset), query each dataset's series and session; nothing writes it back. Paths are relative to this
# file.
datasets:
  # SPY's minutes from Massive, the two years its free plan keeps, the
  # regular session only (09:30 to 15:59 New York time). The closed days
  # and early closes through 2026-10-27 are those of Massive's own data
  # (a weekday without a daily bar; a day whose minutes stop at 13:00);
  # the later ones are the exchange's published calendar. To acquisition,
  # a day closed but not here is a day of the grid, each of its minutes
  # the zero K-line on market.raw, kept forever. Its source plugin,
  # Massive's reader, is the command acquisition runs (plugins.md §3;
  # make build puts it in bin/). Its cleaning, the validation, is the
  # command acquisition runs to keep the series' clean topic, made again
  # when more than tolerance minutes of it are damaged (plugins.md §3).
  - name: massive-spy-1m
    source: massive
    command: [../bin/massive-reader]
    instruments: [SPY]
    timeframes: [M1]
    history: 2y
    reread: 30d   # how far back each run asks again, Massive revising a bar after it has given it
    delay: 20h    # how old a bar must be before it is first read: a session's last, after Massive's day is final
    cleaning: [../bin/validation]
    tolerance: 10 # the damaged minutes, a high or a low changed, the clean topic keeps before it is made again
    session:
      zone: America/New_York
      open: "09:30"
      close: "16:00"
      closed: [2024-11-28, 2024-12-25, 2025-01-01, 2025-01-09, 2025-01-20, 2025-02-17, 2025-04-18, 2025-05-26,
               2025-06-19, 2025-07-04, 2025-09-01, 2025-11-27, 2025-12-25, 2026-01-01, 2026-01-19, 2026-02-16,
               2026-04-03, 2026-05-25, 2026-06-19, 2026-07-03, 2026-09-07, 2026-11-26, 2026-12-25]
      early: { 2024-11-29: "13:00", 2024-12-24: "13:00", 2025-07-03: "13:00", 2025-11-28: "13:00", 2025-12-24: "13:00",
               2026-11-27: "13:00", 2026-12-24: "13:00" }
